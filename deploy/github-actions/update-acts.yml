name: Aktualizacja ustaw z API Sejmu

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:all
      - run: npm test
      - name: Commit, jeśli teksty się zmieniły
        run: |
          if git diff --quiet -- public/data ":(exclude)public/data/acts/updated.json"; then echo "Bez zmian w tekstach"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Aktualizacja tekstów ustaw z API Sejmu ($(date -u +%F))"
          git push
