# sedzia.wisnia.dev – statyczna aplikacja (Vite + prerender) z fallbackiem SPA.
server {
    listen 80;
    listen [::]:80;
    server_name sedzia.wisnia.dev;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sedzia.wisnia.dev;

    ssl_certificate     /etc/letsencrypt/live/sedzia.wisnia.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sedzia.wisnia.dev/privkey.pem;

    root /var/www/sedzia;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml application/xml;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html /index.html;
    }
}
